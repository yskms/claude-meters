name: ClaudeMeters
options:
  bundleIdPrefix: com.yskms
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: true
targets:
  ClaudeMeters:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ClaudeMeters
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yskms.ClaudeMeters
        PRODUCT_NAME: "Claude Meters"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: "Claude Meters"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
  ClaudeMetersTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ClaudeMetersTests
    dependencies:
      - target: ClaudeMeters
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yskms.ClaudeMetersTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Claude Meters.app/Contents/MacOS/Claude Meters"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ClaudeMeters:
    build:
      targets:
        ClaudeMeters: all
        ClaudeMetersTests: [test]
    test:
      targets:
        - ClaudeMetersTests
